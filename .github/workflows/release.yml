name: 构建并发布 Windows 版本

# 触发方式：
# 1. 推送 v 开头的标签时自动运行（如 git tag v1.0.1 && git push --tags）
# 2. 在 GitHub 网页 Actions 页面点 "Run workflow" 手动运行
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 允许上传文件到 Release

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端（Vue + three.js）
        run: npm run build

      - name: 打包 Windows 安装包与便携版
        run: npx electron-builder --win --x64
        env:
          # 用国内镜像下载打包工具，避免 GitHub 下载被限流
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      # 签名步骤（等你申请到 SignPath 免费证书后再启用）：
      # - name: 使用 SignPath 签名
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: Timer
      #     signing-policy-slug: open-source
      #     artifact-configuration-slug: release
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

      - name: 上传 exe 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          body: |
            全屏计时器自动构建产物

            - 便携版（单个 exe）：免安装，双击即用，可放 U 盘
            - 安装版（Setup）：安装到系统，带开始菜单快捷方式

            Windows SmartScreen 首次可能提示"未知发布者"，点"更多信息 → 仍要运行"即可。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
