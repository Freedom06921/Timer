<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全屏计时器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 窗口控制按钮（右上角，悬浮） -->
  <div class="window-controls">
    <button class="control-btn minimize" onclick="timerAPI.minimize()" title="最小化">─</button>
    <button class="control-btn maximize" onclick="timerAPI.maximize()" title="最大化">□</button>
    <button class="control-btn close" onclick="timerAPI.close()" title="关闭">✕</button>
  </div>

  <!-- 主容器：全屏垂直布局，时间居中撑开 -->
  <div class="container">

    <!-- ====== 中央：计时器大显示 ====== -->
    <div class="timer-display">
      <div class="mode-label" id="modeLabel">秒表</div>
      <div class="time" id="timeDisplay">00:00:00</div>
      <div class="milliseconds" id="msDisplay">.000</div>
    </div>

    <!-- ====== 底部：所有控制元素横向排列 ====== -->
    <div class="bottom-bar">

      <!-- 模式切换 -->
      <div class="bottom-section">
        <span class="section-label">模式</span>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="stopwatch" onclick="setMode('stopwatch')">秒表</button>
          <button class="mode-btn" data-mode="countdown" onclick="setMode('countdown')">倒计时</button>
        </div>
      </div>

      <!-- 倒计时输入（默认隐藏） -->
      <div class="bottom-section countdown-setup" id="countdownSetup" style="display: none;">
        <span class="section-label">设定时间</span>
        <div class="countdown-inputs">
          <div class="input-group">
            <label>时</label>
            <input type="number" id="hoursInput" min="0" max="99" value="0">
          </div>
          <span style="color:rgba(255,255,255,0.4);font-size:20px;font-weight:300">:</span>
          <div class="input-group">
            <label>分</label>
            <input type="number" id="minutesInput" min="0" max="59" value="5">
          </div>
          <span style="color:rgba(255,255,255,0.4);font-size:20px;font-weight:300">:</span>
          <div class="input-group">
            <label>秒</label>
            <input type="number" id="secondsInput" min="0" max="59" value="0">
          </div>
          <button class="set-btn" onclick="setCountdown()">确认</button>
        </div>
      </div>

      <!-- 播放控制 -->
      <div class="bottom-section controls">
        <span class="section-label">控制</span>
        <div class="btn-group">
          <button class="btn start" id="startBtn" onclick="startTimer()">开始</button>
          <button class="btn pause" id="pauseBtn" onclick="pauseTimer()" style="display: none;">暂停</button>
          <button class="btn reset" id="resetBtn" onclick="resetTimer()">重置</button>
        </div>
      </div>

      <!-- 颜色选择 -->
      <div class="bottom-section color-picker">
        <span class="section-label">主题色</span>
        <div class="color-options">
          <button class="color-btn active" data-color="#6366f1" style="background: #6366f1;" title="紫色"></button>
          <button class="color-btn" data-color="#ec4899" style="background: #ec4899;" title="粉色"></button>
          <button class="color-btn" data-color="#10b981" style="background: #10b981;" title="绿色"></button>
          <button class="color-btn" data-color="#3b82f6" style="background: #3b82f6;" title="蓝色"></button>
          <button class="color-btn" data-color="#f59e0b" style="background: #f59e0b;" title="橙色"></button>
          <button class="color-btn" data-color="#ef4444" style="background: #ef4444;" title="红色"></button>
          <button class="color-btn" data-color="#8b5cf6" style="background: #8b5cf6;" title="紫罗兰"></button>
          <button class="color-btn" data-color="#14b8a6" style="background: #14b8a6;" title="青色"></button>
          <div class="custom-color">
            <input type="color" id="customColor" value="#6366f1" title="自定义颜色">
            <span>自定义</span>
          </div>
        </div>
      </div>

      <!-- 快捷键提示 -->
      <div class="bottom-section hints">
        <span class="section-label">快捷键</span>
        <div class="hints-row">
          <span><kbd>空格</kbd>开始/暂停</span>
          <span><kbd>R</kbd>重置</span>
        </div>
      </div>

    </div><!-- /bottom-bar -->
  </div><!-- /container -->

  <script src="renderer.js"></script>
</body>
</html>
